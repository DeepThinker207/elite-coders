<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Join Elite Programmers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f2ef; display: flex; align-items: center; min-height: 100vh; }
        .register-card { max-width: 500px; width: 100%; margin: auto; border-radius: 15px; }
    </style>
</head>
<body>
    <div class="card register-card shadow p-4 bg-white">
        <h2 class="text-center mb-4 text-primary">Create Your Profile</h2>
        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
        <div class="text-center mb-4">
            <a href="/" class="text-decoration-none">
                <h1 class="fw-bold fs-2 text-primary">
                    <span class="text-warning">{&lt;/&gt;}</span> Elite Coders
                </h1>
            </a>
        <p class="text-muted small">Code. Collaborate. Conquer.</p>
        </div>
        <form th:action="@{/save}" th:object="${user}" method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="Deepesh Singh" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Create Password</label>
                <input type="password" th:field="*{password}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Headline</label>
                <input type="text" th:field="*{headline}" class="form-control" placeholder="Java Developer | Spring Boot Enthusiast">
            </div>
            <div class="mb-3">
                <label class="form-label">GitHub URL</label>
                <input type="url" th:field="*{githubLink}" class="form-control" placeholder="https://github.com/your-username">
            </div>
            <div class="mb-3">
                <label class="form-label">Bio</label>
                <textarea th:field="*{bio}" class="form-control" rows="3" placeholder="Tell the world about your skills..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register as Elite</button>
            <div class="text-center mt-3">
                <a href="/" class="text-decoration-none text-muted small">Cancel and go back</a>
            </div>
        </form>
    </div>
</body>
</html>
