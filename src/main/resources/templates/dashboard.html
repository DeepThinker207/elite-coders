<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Elite Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f2ef; }
        .dashboard-card { border-radius: 15px; border: none; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card dashboard-card shadow p-4">
                    <div class="text-center">
                        <h2 class="text-primary fw-bold">My Elite Profile</h2>
                        <hr>
                    </div>
                    <div class="mt-4">
                        <h4 th:text="${user.name}"></h4>
                        <p class="text-muted" th:text="${user.headline}"></p>
                        <p><strong class="text-dark">Bio: </strong><span th:text="${user.bio}"></span></p>
                        <p><strong class="text-dark">GitHub: </strong><a th:href="${user.githubLink}" target="_blank" th:text="${user.githubLink}"></a></p>
                        
                        <div class="mt-4">
                            <a href="/edit-profile" class="btn btn-primary shadow-sm">Edit My Profile</a>
                            <a href="/" class="btn btn-secondary text-white">Go to Feed</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
