<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in | Elite Coders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f6f8fa; font-family: 'Inter', sans-serif; color: #0d1117; height: 100vh; display: flex; flex-direction: column; }
        .brand-logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.8rem; color: #0d1117; text-decoration: none; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }
        .brand-icon { color: #0969da; background: rgba(9, 105, 218, 0.15); width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; margin-right: 10px; font-size: 1.2rem; }
        .login-card { background: #fff; border: 1px solid #d0d7de; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 40px; }
        .form-control { border-radius: 8px; padding: 12px 15px; border: 1px solid #d0d7de; font-size: 0.95rem; }
        .form-control:focus { border-color: #0969da; box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15); }
        .btn-primary { background-color: #0969da; border: none; font-weight: 600; padding: 12px; border-radius: 8px; }
        .btn-primary:hover { background-color: #0552a5; }
    </style>
</head>
<body class="justify-content-center align-items-center">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <a href="/" class="brand-logo">
                <span class="brand-icon"><i class="fa-solid fa-code"></i></span>
                Elite<span style="color:#0969da;">Coders</span>
            </a>

            <div class="login-card">
                <h4 class="text-center fw-bold mb-1" style="font-family: 'Space Grotesk', sans-serif;">Welcome back</h4>
                <p class="text-center text-muted small mb-4">Sign in to your account to continue.</p>

                <div th:if="${param.registered}" class="alert alert-success p-3 small rounded-3 fw-medium">
                    <i class="fa-solid fa-check-circle me-1"></i> Registration successful! Please sign in.
                </div>
                <div th:if="${param.error}" class="alert alert-danger p-3 small rounded-3 fw-medium">
                    <i class="fa-solid fa-circle-exclamation me-1"></i> Invalid email or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-info p-3 small rounded-3 fw-medium">
                    <i class="fa-solid fa-info-circle me-1"></i> You have been logged out.
                </div>

                <form action="/login" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Email Address</label>
                        <input type="email" name="username" class="form-control" placeholder="hello@elitecoders.com" required>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label class="form-label small fw-bold text-secondary">Password</label>
                        </div>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 shadow-sm">
                        Sign in
                    </button>
                </form>
            </div>

            <div class="text-center mt-4 p-3 border rounded bg-white shadow-sm" style="border-color: #d0d7de !important;">
                <p class="small mb-0">New to Elite Coders? <a href="/register" class="fw-bold text-decoration-none" style="color:#0969da;">Create an account</a></p>
            </div>

        </div>
    </div>
</div>

</body>
</html>
