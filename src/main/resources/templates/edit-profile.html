<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile | Elite Coders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .edit-card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card edit-card p-4">
                <h3 class="fw-bold mb-4">Edit Your Profile</h3>
                
                <form action="/updateProfile" method="post">
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Professional Headline</label>
                        <input type="text" name="headline" class="form-control" 
                               th:value="${user.headline}" placeholder="e.g. Java Developer | Spring Boot Enthusiast">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">GitHub Profile URL</label>
                        <input type="url" name="githubLink" class="form-control" 
                               th:value="${user.githubLink}" placeholder="https://github.com/yourusername">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Short Bio</label>
                        <textarea name="bio" class="form-control" rows="4" 
                                  placeholder="Tell the community about your skills..." 
                                  th:text="${user.bio}"></textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a href="/dashboard" class="text-decoration-none text-muted small">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold">Save Changes</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
