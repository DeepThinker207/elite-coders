version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: elite_postgres
    environment:
      POSTGRES_DB: elite_coders_db
      POSTGRES_USER: elite_user
      POSTGRES_PASSWORD: elite_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: elite_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: